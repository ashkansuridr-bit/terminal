name: Android release gate

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Kotlin compiler
        run: |
          curl --fail --location -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
          unzip -q /tmp/kotlinc.zip -d /opt
          echo '/opt/kotlinc/bin' >> "$GITHUB_PATH"
      - name: Source and artifact validator gates
        run: |
          python3 scripts/source_audit.py
          python3 scripts/market_release_gate.py
          python3 scripts/loop2_gate.py
          python3 -m unittest discover -s scripts -p 'test_release_artifacts.py' -v
      - name: Unit tests, lint and both debug builds
        run: ./gradlew --no-daemon clean testMarketDebugUnitTest testGplayDebugUnitTest lintMarketDebug lintGplayDebug assembleMarketDebug assembleGplayDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ github.sha }}
          if-no-files-found: error
          path: app/build/reports/

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
        build: [debug, preview]
        include:
          # Android 17 (API 37): advisory until the 26/36 gates are proven stable on it.
          - { api: '37.0', build: debug, experimental: true }
          - { api: '37.0', build: preview, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrument actual debug and minified preview variants
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon -Pterminal.testBuildType=${{ matrix.build }} connectedMarket${{ matrix.build == 'preview' && 'Preview' || 'Debug' }}AndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-${{ matrix.api }}-${{ matrix.build }}-${{ github.sha }}
          if-no-files-found: error
          path: app/build/reports/androidTests/

  release-candidates:
    needs: [verify, instrumentation]
    runs-on: ubuntu-latest
    # Deliberately do not inject production signing secrets. Market files MUST be unsigned.
    env:
      TERMINAL_KEYSTORE_PATH: ''
      TERMINAL_KEYSTORE_PASSWORD: ''
      TERMINAL_KEY_ALIAS: ''
      TERMINAL_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build candidates from this checkout
        run: ./gradlew --no-daemon clean testMarketReleaseUnitTest lintMarketRelease assembleMarketPreview assembleMarketRelease bundleMarketRelease
      - name: Download pinned bundle inspector
        run: curl --fail --location -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
      - name: Inspect package, versions, signing and archive contents
        run: |
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -file "$RUNNER_TEMP/preview-cert.der"
          python3 scripts/package_release.py --bundletool "$RUNNER_TEMP/bundletool.jar" --preview-cert "$RUNNER_TEMP/preview-cert.der" --output release-assets
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates-${{ github.sha }}
          if-no-files-found: error
          path: release-assets/

  # No publication job: instrumentation above rebuilds with test-specific R8 rules.
  # It does not verify the exact canonical preview binary packaged by this job,
  # and the complete critical release coverage is not yet demonstrated.
  # Candidates remain private CI artifacts, including on tags. Publication must be
  # added only once exact-binary runtime gates and all critical suites are proven.
